[package]
name = "iawar-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "MouseEvent", "CssStyleDeclaration", "EventTarget"] }
console_error_panic_hook = "0.1.7"
three-d = { version = "0.19.0", features = ["egui-gui"] }
three-d-asset = { version = "0.10", features = ["gltf", "jpeg", "http"] }
wasm-bindgen-futures = "0.4"
expression_evaluator = { path = "crates/expression_evaluator" }

[workspace]
members = ["src-tauri", "crates/expression_evaluator"]
